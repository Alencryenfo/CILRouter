services:
  cilrouter:
    build: .
    container_name: cilrouter
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./config.yaml:/app/config.yaml
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
